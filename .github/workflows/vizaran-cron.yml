name: Vizaran order reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Process order reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ] || [ -z "$VERCEL_BYPASS_SECRET" ]; then
            echo "Missing required repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" \
            "https://${VERCEL_URL}/api/cron/orders"
